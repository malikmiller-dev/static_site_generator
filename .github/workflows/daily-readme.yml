name: Daily README update

on:
  schedule:
    - cron: '0 12 * * *'
      timezone: America/New_York
  workflow_dispatch:
  # Verify the full update flow when its script or configuration changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-readme.yml'
      - 'scripts/update_readme.py'

permissions:
  contents: write

concurrency:
  group: daily-readme-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Append today's update
        run: python3 scripts/update_readme.py

      - name: Commit and push README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No README change needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m "chore: daily README update $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
