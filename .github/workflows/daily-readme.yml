name: Daily README update

on:
  schedule:
    # Temporary timer verification; removed after testing.
    - cron: '*/5 * * * *'
    # Noon Eastern is 16:00 UTC in summer and 17:00 UTC in winter.
    # The script skips pre-noon runs and dates already recorded.
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    # Backup attempts if GitHub delays or drops the top-of-hour trigger.
    - cron: '17,37 16,17 * * *'
  workflow_dispatch:
  # Verify the full update flow when its script or configuration changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-readme.yml'
      - 'scripts/update_readme.py'

permissions:
  contents: write

concurrency:
  group: daily-readme-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Append today's update
        run: python3 scripts/update_readme.py --scheduled

      - name: Commit and push README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No README change needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m "chore: daily README update $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
